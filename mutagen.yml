sync:
  defaults:
    mode: two-way-resolved  # 双向同步
    permissions:
      defaultFileMode: 0644
      defaultDirectoryMode: 0755
    ignore:
      paths:
        - "node_modules/**"
  # laradock 环境
  laradock:
    alpha: "/mnt/d/work/laradock"
    beta: "/home/ryun/projects/laradock"
    ignore:
      paths:
        - "data/**"      # 忽略数据目录
        - "logs/**"      # 忽略日志目录
  # JKT_SYSTEM 子项目
  JKT-ADM:
    alpha: "/mnt/d/work/JKT_SYSTEM/ADM"
    beta: "/home/ryun/projects/JKT_SYSTEM/ADM"
    ignore:
      paths:
        - ".git/**"
        - ".claude/**"
  JKT-CRM:
    alpha: "/mnt/d/work/JKT_SYSTEM/CRM"
    beta: "/home/ryun/projects/JKT_SYSTEM/CRM"
    ignore:
      paths:
        - ".git/**"
        - ".claude/**"
  JKT-OA:
    alpha: "/mnt/d/work/JKT_SYSTEM/OA"
    beta: "/home/ryun/projects/JKT_SYSTEM/OA"
    ignore:
      paths:
        - ".git/**"
        - ".claude/**"
  JKT-hppi-idr-cn:
    alpha: "/mnt/d/work/JKT_SYSTEM/hppi_idr_cn"
    beta: "/home/ryun/projects/JKT_SYSTEM/hppi_idr_cn"
    ignore:
      paths:
        - ".git/**"
        - ".claude/**"
  JKT-projm:
    alpha: "/mnt/d/work/JKT_SYSTEM/projm"
    beta: "/home/ryun/projects/JKT_SYSTEM/projm"
    ignore:
      paths:
        - ".git/**"
        - ".claude/**"
  # drpeixun_cn 项目
  drpeixun-cn:
    alpha: "/mnt/d/work/drpeixun_cn"
    beta: "/home/ryun/projects/drpeixun_cn"
  # 可以按此格式继续添加其他项目...
